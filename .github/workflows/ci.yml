name: DBMS project CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: esports
          POSTGRES_PASSWORD: esports_dev_only
          POSTGRES_DB: esports_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esports -d esports_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: mongo_dev_only
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --username root --password mongo_dev_only --authenticationDatabase admin --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://esports:esports_dev_only@localhost:5432/esports_platform_test
      TEST_DATABASE_URL: postgresql://esports:esports_dev_only@localhost:5432/esports_platform_test
      MONGODB_URI: mongodb://root:mongo_dev_only@localhost:27017/esports_audit?authSource=admin
      MONGODB_DB: esports_audit
      TEST_MONGODB_URI: mongodb://root:mongo_dev_only@localhost:27017/esports_audit_test?authSource=admin
      SESSION_SECRET: ci-only-secret-change-before-real-deployment-32-chars
      APP_URL: http://localhost:3000
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply schema to disposable test database
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
      - name: Run fast and database integration tests
        run: npm test
      - name: TypeScript validation
        run: npm run typecheck
      - name: Next.js production build
        run: npm run build
